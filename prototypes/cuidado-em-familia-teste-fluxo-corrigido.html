<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nós Cuidamos • Demonstração</title><style>
:root{--g:#087b67;--g2:#0d6255;--mint:#e0f7f2;--bg:#f5fbf9;--ink:#102332;--muted:#5a6b71;--line:#d9eae6;--shadow:0 3px 12px #184e4512}*{box-sizing:border-box}body{margin:0;background:#e8f2ef;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100dvh;background:var(--bg);padding-bottom:95px;box-shadow:0 0 30px #244b3b1c}.top{background:linear-gradient(125deg,#fff 15%,#c9f0e9 100%);padding:26px 18px 22px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:32px;color:var(--g)}.brand strong{font-size:20px}.brand small{display:block;font-size:12px}.patient{background:white;border:1px solid var(--line);border-radius:19px;padding:14px;display:flex;align-items:center;gap:12px;margin-top:23px;box-shadow:var(--shadow)}.avatar{width:55px;height:55px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:var(--g);font-size:20px;font-weight:800}.patient b{font-size:21px}.patient small{display:block;color:var(--muted)}main{padding:18px 17px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{background:var(--mint);border:0;border-radius:16px;padding:12px 3px;min-height:104px;color:var(--ink);font-size:11px;line-height:1.25}.action .ico{display:block;font-size:29px;color:var(--g);margin-bottom:7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:23px 0 10px}.section-head h2{font-size:18px;margin:0}.link{border:0;background:transparent;color:var(--g2);font-weight:700;font-size:13px;padding:5px}.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:10px}.tap{cursor:pointer}.muted{color:var(--muted);font-size:13px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.date{background:var(--mint);border-radius:14px;padding:10px;min-width:66px;text-align:center}.date b{font-size:25px;display:block}.appt{display:flex;gap:13px;align-items:center}.appt h3{font-size:16px;margin:0 0 6px}.appt p{margin:4px 0;font-size:13px}.tag{display:inline-block;background:var(--mint);color:var(--g2);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:650;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:var(--mint);padding:12px 9px;border-radius:14px;font-size:11px}.stat b{float:right;font-size:23px;color:var(--g)}.stat:nth-child(3){background:#fff1dd}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 2px max(12px,env(safe-area-inset-bottom));z-index:10}.bottom button{background:none;border:0;color:#53666a;font-size:10px;min-width:18%;padding:7px 2px;border-radius:12px}.bottom button span{display:block;font-size:24px}.bottom button.active{background:var(--mint);color:var(--g);font-weight:800}.page-title{display:flex;align-items:center;gap:10px;margin-bottom:18px}.page-title h1{font-size:23px;margin:0}.back{background:var(--mint);border:0;border-radius:11px;color:var(--g);padding:9px 12px}.primary{border:0;background:var(--g);color:white;border-radius:12px;padding:13px 16px;font-weight:750;width:100%;margin:10px 0}.secondary{border:1px solid var(--line);background:white;color:var(--g);border-radius:12px;padding:12px 14px;font-weight:700}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;border:0;border-radius:11px;padding:10px;background:var(--mint);color:var(--g2)}.tabs .sel{background:var(--g);color:white}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #cbded9;border-radius:11px;background:white;padding:12px;color:var(--ink)}textarea{min-height:82px;resize:vertical}.help{font-size:12px;color:var(--muted);line-height:1.5}.notice{background:#fff3df;padding:13px;border-radius:12px;font-size:13px;margin:12px 0}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:var(--mint);color:var(--g2);font-size:11px;font-weight:700}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#153e36;color:white;padding:12px 16px;border-radius:12px;max-width:90%;width:max-content;z-index:30;box-shadow:var(--shadow)}.smallbtn{border:0;background:var(--mint);color:var(--g2);border-radius:10px;padding:9px 12px;font-weight:700}.empty{padding:20px;text-align:center;color:var(--muted)}@media(min-width:650px){.app{margin:22px auto;border-radius:22px;overflow:hidden;min-height:calc(100dvh - 44px)}}
.post-actions{display:flex;flex-direction:column;gap:10px;margin:14px 0}.post-actions .primary,.post-actions .secondary{box-sizing:border-box;width:100%;min-height:48px;margin:0;padding:13px 16px;border:1px solid transparent;border-radius:12px;font-weight:750}.post-actions .secondary{border-color:var(--line)}#suspensionDialog{box-sizing:border-box;width:calc(100% - 32px);max-width:420px;max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--ink);background:white;box-shadow:var(--shadow)}#suspensionDialog::backdrop{background:rgb(16 35 50 / 55%)}#suspensionDialog h2{font-size:21px;margin:0 0 16px}#suspensionDialog p{line-height:1.5;overflow-wrap:anywhere}.actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:112px;padding:16px 10px;font-size:16px;font-weight:700;line-height:1.35;color:#102f2a;border:1px solid #c7e7de}.action .ico{display:block;width:32px;height:32px;margin:0;color:#075e50}.action .ico svg{display:block;width:100%;height:100%}.action:focus-visible{outline:3px solid #075e50;outline-offset:3px}.action:hover{background:#cceee5}#appointmentConflictDialog{box-sizing:border-box;width:calc(100% - 32px);max-width:420px;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--ink)}#appointmentConflictDialog::backdrop{background:rgb(16 35 50 / 55%)}#appointmentConflictDialog p{line-height:1.5}.stats .stat{border:0;text-align:left;color:var(--ink);font-family:inherit;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:90px;font-size:13px;line-height:1.35}.stats .stat b{float:none;align-self:flex-end}.stats .stat:focus-visible{outline:3px solid var(--g);outline-offset:3px}.stats .stat:hover{box-shadow:inset 0 0 0 2px var(--g)}#dosageDialog{box-sizing:border-box;width:calc(100% - 32px);max-width:420px;max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--ink);background:white}#dosageDialog::backdrop{background:rgb(16 35 50 / 55%)}#dosageDialog h2{font-size:21px;margin:0 0 16px}#dosageDialog p{overflow-wrap:anywhere}.report-heading{margin-bottom:20px}.report-heading h1{font-size:24px}.report-heading p{line-height:1.5}.report-entry h2{font-size:18px}.report-entry h3{font-size:16px}.report-notes{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.report-entry li{overflow-wrap:anywhere}@media print{@page{size:A4;margin:18mm}body{background:white;color:black}.app{max-width:none;width:100%;margin:0;padding:0;min-height:0;border-radius:0;box-shadow:none;overflow:visible}.bottom,.report-page .no-print,.toast,dialog{display:none!important}.report-page{padding:0}.report-entry{box-shadow:none;border:1px solid #bbb;border-radius:0;margin:0 0 16px;padding:14px}.report-entry h2,.report-entry h3{break-after:avoid}.report-notes{orphans:3;widows:3}.report-page .help{color:#333;font-size:11pt}} .medication-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:0 0 16px}.medication-actions .primary,.medication-actions .secondary{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0;padding:13px 16px;border:1px solid transparent;border-radius:12px;font-size:16px;font-weight:700;line-height:1.35;text-align:center}.medication-actions .secondary{border-color:#badbd2}.medication-actions button:focus-visible{outline:3px solid var(--g);outline-offset:3px}.patient .avatar{flex-shrink:0}.patient-info{flex:1;min-width:0}.patient-info b{display:block;overflow-wrap:anywhere;line-height:1.25}.patient-info small{margin-top:4px}.patient-arrow{width:22px;height:22px;flex-shrink:0;margin-left:auto;color:var(--g)}#companionDialog{box-sizing:border-box;width:calc(100% - 32px);max-width:420px;max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--ink);background:white}#companionDialog::backdrop{background:rgb(16 35 50 / 55%)}#companionDialog h2{font-size:21px;margin:0 0 16px}#companionDialog p{overflow-wrap:anywhere}#companionError{color:#a42121;font-weight:600}.options-list{display:flex;flex-direction:column;margin:0 0 20px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white}.option-row{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:16px;text-align:left;background:white;border:0;border-bottom:1px solid var(--line);color:var(--ink);font-size:16px;line-height:1.4}.option-row:last-child{border-bottom:0}.option-icon{display:flex;width:24px;height:24px;flex-shrink:0;color:var(--g2)}.option-icon svg{width:100%;height:100%}.option-label{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}.option-arrow{width:20px;height:20px;flex-shrink:0;color:var(--g2);margin-left:auto}.option-row:hover{background:var(--mint)}.option-row:focus-visible{outline:3px solid var(--g);outline-offset:-3px}#cancellationDialog{box-sizing:border-box;width:calc(100% - 32px);max-width:420px;max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--ink);background:white}#cancellationDialog::backdrop{background:rgb(16 35 50 / 55%)}#cancellationDialog h2{font-size:21px;margin:0 0 16px}#cancellationDialog p{overflow-wrap:anywhere}#cancellationError{color:#a42121}#treatmentDialog{box-sizing:border-box;width:calc(100% - 32px);max-width:420px;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--ink)}#treatmentDialog::backdrop{background:#10233299}</style></head><body><div class="app"><div id="root"></div></div><script>
const KEY='cuidado-familia-demo-v3-clean';
const initial={patient:'',dob:'',allergies:'',medicalInfo:'',photo:'',patients:[],activePatientId:null,records:{},appointments:[],meds:[],family:[],invites:[],history:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(initial))}catch(e){db=JSON.parse(JSON.stringify(initial))}
function snapshot(){return {appointments:db.appointments,meds:db.meds,family:db.family,invites:db.invites,history:db.history}}
function switchPatient(id){if(db.activePatientId)db.records[db.activePatientId]=snapshot();const p=db.patients.find(x=>String(x.id)===String(id));if(!p)return;db.activePatientId=p.id;db.patient=p.name;db.dob=p.dob;db.allergies=p.allergies;db.medicalInfo=p.medicalInfo;db.photo=p.photo||'';Object.assign(db,db.records[id]||{appointments:[],meds:[],family:[],invites:[],history:[]});save();go('home')}
let page='home',tab='Próximos',selected=null,kind='Consulta';
let formDrafts={},companionReturn=null,justAddedCompanion='';
function captureDraft(form,key){if(!form)return;let d={};for(let el of form.elements){if(!el.name)continue;d[el.name]=el.type==='checkbox'?el.checked:el.value}formDrafts[key]=d}
function restoreDraft(form,key){if(!form||!formDrafts[key])return;for(let el of form.elements){if(!el.name||!(el.name in formDrafts[key]))continue;if(el.type==='checkbox')el.checked=!!formDrafts[key][el.name];else el.value=formDrafts[key][el.name]}if(key==='appointment'){let prep=document.getElementById('prep');if(prep)prep.style.display=form.elements.hasPrep?.value==='Sim'?'block':'none'}}
function addCompanionFrom(origin){companionReturn=origin;captureDraft(document.querySelector(origin==='appointment'?'#apptForm':'#importForm'),origin);go('addCompanion')}
function changeAppointmentType(value){captureDraft(document.getElementById('apptForm'),'appointment');kind=value;formDrafts.appointment.type=value;render()}

const $=id=>document.getElementById(id),save=(strict=false)=>{try{if(db.activePatientId)db.records[db.activePatientId]=snapshot();localStorage.setItem(KEY,JSON.stringify(db));if(typeof queueNotificationSync==='function')queueNotificationSync()}catch(e){if(strict)throw new Error('Armazenamento cheio ou indisponível. Seu formulário foi preservado.')}},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'Não informado';
const btn=(text,to,cls='primary')=>`<button class="${cls}" onclick="go('${to}')">${text}</button>`;
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function go(p,id,resumeAppointment=false){if(p==='meds')tab='Em uso';if(p==='newAppointment'&&!resumeAppointment){delete formDrafts.appointment;kind='Consulta';companionReturn=null;justAddedCompanion=''}page=p;selected=id??null;render();window.scrollTo(0,0)}
function navigatePrimary(target){if(!db.activePatientId&&['agenda','meds','history'].includes(target)){go('newPatient');toast('Cadastre o primeiro paciente para acessar esta seção.');return}go(target)}
function nav(){return `<nav class="bottom" aria-label="Navegação principal">${[['home','⌂','Início'],['agenda','▦','Agenda'],['meds','◇','Remédios'],['history','◴','Histórico'],['more','☰','Mais']].map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="navigatePrimary('${p}')"><span aria-hidden="true">${i}</span>${n}</button>`).join('')}</nav>`}
function head(t){return `<div class="page-title"><button class="back" onclick="go('home')">‹</button><h1>${t}</h1></div>`}
function appointment(a){return `<div class="card tap" onclick="go('appointment',${a.id})"><div class="appt"><div class="date"><small>${fmt(a.date).slice(0,5)}</small><b>${esc(a.time)}</b></div><div><h3>${esc(a.type)} – ${esc(a.name)}</h3><p>⌖ ${esc(a.location||'Local não informado')}</p><p>♧ Acompanhante: ${esc(a.status==='Realizado'?(a.companionAtCompletion??a.companion??'Não informado'):(a.companion||'Não informado'))}</p><span class="pill">${esc(a.status)}</span></div></div></div>`}
function actionIcon(name){const paths={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-14 5h3m4 0h3"/>',pill:'<path d="M9 4a6 6 0 0 1 8.5 8.5l-5 5A6 6 0 0 1 4 9zM8 8l8 8"/>',family:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m3-13v6m-3-3h6"/>',report:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8m-8 4h6"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">'+(paths[name]||'')+'</svg>'}
function home(){if(!db.activePatientId)return patientWelcome();let a=db.appointments.find(a=>a.status==='Agendado')||db.appointments[0];return `<header class="top"><div class="brand"><div class="logo">♡</div><div><strong>Nós Cuidamos</strong><small>Acompanhamento Médico Familiar</small></div></div><div class="patient tap" onclick="go('patients')"><div class="avatar">${db.photo?`<img src="${db.photo}" alt="" style="width:55px;height:55px;object-fit:cover;border-radius:50%">`:esc(db.patient.slice(0,2).toUpperCase())}</div><div class="patient-info"><b>${esc(db.patient)}</b><small>${age(db.dob)} anos · trocar paciente</small></div><svg class="patient-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg></div></header><main><div class="actions">${[['calendar','Agendar','newAppointment'],['pill','Medicamento','newMed'],['family','Convidar familiar','invite'],['report','Relatório PDF','reports']].map(([i,t,p])=>`<button class="action" onclick="go('${p}')"><span class="ico" aria-hidden="true">${actionIcon(i)}</span><span>${t}</span></button>`).join('')}</div><div class="section-head"><h2>▦ Próximo atendimento</h2><button class="link" onclick="go('agenda')">Ver agenda ›</button></div>${a?appointment(a):'<div class="card">Nenhum agendamento.</div>'}<div class="section-head"><h2>◇ Medicamentos em uso</h2><button class="link" onclick="go('meds')">Ver todos ›</button></div><div class="card">${db.meds.filter(m=>m.status==='Em uso').slice(0,3).map(m=>`<div class="item tap" onclick="go('medDetail',${m.id})"><b>◇ ${esc(m.name)} ${esc(m.strength)}</b><div class="muted">${esc(m.amount)} · ${esc(m.schedule)}</div></div>`).join('')||'Nenhum medicamento em uso.'}</div><div class="stats">${[['consultations','Consultas próximas'],['exams','Exames agendados'],['results','Resultados pendentes']].map(([filter,label])=>`<button type="button" class="stat" onclick="go('appointmentList','${filter}')"><span>${label}</span><b>${summaryAppointments(filter).length}</b></button>`).join('')}</div><div class="section-head"><h2>◴ Últimos registros</h2><button class="link" onclick="go('history')">Ver histórico ›</button></div>${db.appointments.filter(a=>a.status==='Realizado').slice(-1).map(appointment).join('')||'<div class="card">Sem registros anteriores.</div>'}</main>`}
function summaryAppointments(filter){return db.appointments.filter(a=>filter==='consultations'?a.type==='Consulta'&&a.status==='Agendado':filter==='exams'?a.type==='Exame'&&a.status==='Agendado':filter==='results'?a.type==='Exame'&&a.status==='Realizado'&&!(a.results||[]).length&&!a.result:false)}
function appointmentList(){const titles={consultations:'Consultas próximas',exams:'Exames agendados',results:'Resultados pendentes'};const title=titles[selected]||'Agendamentos';const items=summaryAppointments(selected);return `<main>${head(title)}<p class="muted">Paciente: ${esc(db.patient)}</p>${items.map(appointment).join('')||'<div class="empty">Nenhum agendamento nesta listagem.</div>'}</main>`}
function agenda(){let items=db.appointments.filter(a=>tab==='Próximos'?a.status==='Agendado':a.status!=='Agendado');return `<main>${head('Agenda')}<div class="medication-actions">${btn('+ Novo agendamento','newAppointment')}${btn('Ler solicitação de exame','scanExam','secondary')}</div><div class="tabs">${['Próximos','Histórico'].map(x=>`<button class="${tab===x?'sel':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}</div>${items.map(appointment).join('')||'<div class="empty">Nenhum atendimento nesta categoria.</div>'}</main>`}
function validCalendarDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [year,month,day]=value.split('-').map(Number);if(year<1||month<1||month>12||day<1)return false;const leap=year%4===0&&(year%100!==0||year%400===0);return day<=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][month-1]}
function validateDateInput(input){const invalid=input.value?!validCalendarDate(input.value):input.validity.badInput;input.setCustomValidity(invalid?'Informe uma data válida com ano de 4 dígitos.':'');return !invalid}
function validateFormDates(form){for(const input of form.querySelectorAll('input[type="date"]')){if(!validateDateInput(input)||(!input.value&&input.required)){input.reportValidity();input.focus();return false}}return true}
function field(label,name,required=false,type='text',value=''){return `<label for="${name}">${label}${required?' *':''}</label><input id="${name}" name="${name}" type="${type}" ${type==='date'?'min="0001-01-01" max="9999-12-31" oninput="validateDateInput(this)"':''} value="${esc(value)}" ${required?'required':''}>`}
function newAppointment(){return `<main>${head('Novo agendamento')}<form id="apptForm" onsubmit="saveAppointment(event)"><label>Tipo de atendimento</label><select name="type" onchange="changeAppointmentType(this.value)"><option ${kind==='Consulta'?'selected':''}>Consulta</option><option ${kind==='Exame'?'selected':''}>Exame</option></select>${field(kind==='Consulta'?'Especialidade':'Nome do exame','name',true)}${kind==='Consulta'?field('Médico (opcional)','doctor'):''}${field('Data','date',true,'date')}${field('Horário','time',true,'time')}${field('Local','location',true)}<label>Acompanhante (opcional)</label>${db.family.length?`<select name="companion"><option value="">Sem acompanhante definido</option>${db.family.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select>`:`<p class="help">Nenhum acompanhante cadastrado. Você pode agendar sem acompanhante ou cadastrar um agora.</p>`}<button type="button" class="secondary" style="width:100%;margin-top:10px" onclick="addCompanionFrom('appointment')">+ Cadastrar acompanhante</button>${kind==='Exame'?`<label>Exige preparo?</label><select name="hasPrep" onchange="$('prep').style.display=this.value==='Sim'?'block':'none'"><option>Não</option><option>Sim</option></select><div id="prep" style="display:none">${field('Instruções de preparo','prep')}</div>`:''}${kind==='Consulta'?`<label>Observações pré-atendimento</label><textarea name="notes" placeholder="Dúvidas, sintomas ou informações para levar"></textarea>`:''}<div class="post-actions"><button class="primary" type="submit">Salvar agendamento</button><button class="secondary" type="button" onclick="discardAppointment()">Cancelar</button></div></form></main>`}
function normalizedCompanion(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,' ').toLocaleLowerCase('pt-BR')}
function appointmentConflict(candidate,excludeId=null,pending=[]){const active=String(db.activePatientId);const groups=new Map(Object.entries(db.records||{}).map(([id,record])=>[String(id),record.appointments||[]]));groups.set(active,db.appointments);const companion=normalizedCompanion(candidate.companion);for(const [patientId,appointments] of groups){for(const item of appointments){if(item.status==='Cancelado'||(patientId===active&&excludeId!==null&&item.id===excludeId))continue;if(item.date!==candidate.date||item.time!==candidate.time)continue;if(patientId===active)return 'Este paciente já possui um agendamento neste dia e horário. Escolha outro horário.';if(companion&&normalizedCompanion(item.companion)===companion)return 'Este acompanhante já possui um agendamento com outro paciente neste dia e horário. Escolha outro horário ou acompanhante.'}}if(pending.some(item=>item.date===candidate.date&&item.time===candidate.time))return 'Há exames deste pedido com o mesmo dia e horário para o paciente. Ajuste os horários antes de confirmar.';return ''}
function showConflict(message){let dialog=document.getElementById('appointmentConflictDialog');if(dialog)dialog.remove();dialog=document.createElement('dialog');dialog.id='appointmentConflictDialog';dialog.setAttribute('aria-labelledby','conflictTitle');dialog.setAttribute('aria-describedby','conflictDescription');dialog.innerHTML=`<h2 id="conflictTitle">Conflito de agendamento</h2><p id="conflictDescription">${esc(message)}</p><button class="primary" type="button">Entendi</button>`;const previous=document.activeElement;const close=()=>{dialog.close();dialog.remove();if(previous?.isConnected)previous.focus()};dialog.querySelector('button').onclick=close;dialog.addEventListener('cancel',e=>{e.preventDefault();close()});document.body.append(dialog);dialog.showModal()}
function discardAppointment(){delete formDrafts.appointment;companionReturn=null;justAddedCompanion='';kind='Consulta';go('agenda')}
function saveAppointment(e){e.preventDefault();if(!validateFormDates(e.target))return;let d=Object.fromEntries(new FormData(e.target));if(d.hasPrep==='Sim'&&!d.prep?.trim()){toast('Informe as instruções de preparo.');return}let conflict=appointmentConflict(d);if(conflict){showConflict(conflict);return}let a={...d,id:Date.now(),status:'Agendado'};db.appointments.unshift(a);log('Agendamento criado: '+a.type+' – '+a.name);delete formDrafts.appointment;save();go('agenda');toast('Agendamento salvo!')}
function detail(){let a=db.appointments.find(x=>x.id===selected);if(!a)return '<main>Registro não encontrado.</main>';return `<main>${head('Detalhes do atendimento')}<div class="card"><h2>${esc(a.type)} – ${esc(a.name)}</h2><p>${fmt(a.date)} · ${esc(a.time)}</p><p>${esc(a.location)}</p>${a.doctor?`<p>Médico: ${esc(a.doctor)}</p>`:''}<p><b>Acompanhante:</b> ${esc(a.companionAtCompletion??a.companion??'Não informado')}</p><span class="pill">${esc(a.status)}</span></div>${a.prep?`<div class="notice"><b>Preparo:</b> ${esc(a.prep)}</div>`:''}${a.type==='Consulta'?`<div class="card"><b>Observações pré-atendimento</b><p class="muted">${esc(a.notes||'Nenhuma observação registrada.')}</p></div>`:''}${a.status==='Realizado'?`<div class="card"><b>Observações pós-atendimento</b><p>${esc(a.postNotes||'Ainda não registradas.')}</p>${postDocuments(a)}</div>`:''}${a.type==='Exame'?`<div class="card"><b>Resultados de exame</b>${(a.results||[]).map((r,i)=>`<div class="item"><b>${esc(r.name)}</b><p class="muted">${esc(r.date||'Data não informada')} · ${esc(r.fileName)}</p><button class="smallbtn" onclick="openResult(${a.id},${i})">Visualizar anexo</button></div>`).join('')||'<p class="muted">Nenhum resultado anexado.</p>'}<button class="secondary" style="width:100%;margin-top:8px" onclick="go('addResult',${a.id})">+ Anexar resultado de exame</button></div>`:''}${a.status==='Agendado'?`<button class="secondary" style="width:100%;margin:5px 0" onclick="changeCompanion(${a.id})">Substituir acompanhante</button>`:''}${a.status!=='Realizado'?`<button class="secondary" style="width:100%;margin:5px 0" onclick="go('reschedule',${a.id})">Reagendar</button>`:''}${a.status==='Agendado'?`<button class="primary" onclick="complete(${a.id})">Confirmar realização</button>`:''}${a.status==='Agendado'?`<button class="secondary" style="width:100%;margin:5px 0;color:#a42121" onclick="cancelAppointment(${a.id})">Cancelar agendamento</button>`:''}${a.status==='Realizado'?`<button class="primary" onclick="addPost(${a.id})">Registrar observações pós-atendimento</button>`:''}<p class="help">Demonstração: permissões reais entre usuários ainda não implementadas.</p></main>`}
let companionReturnFocus=null;
function changeCompanion(id){const a=db.appointments.find(x=>x.id===id);if(!a||a.status!=='Agendado'){toast('O acompanhante de um atendimento realizado deve ser preservado.');return}if(document.getElementById('companionDialog'))return;companionReturnFocus=document.activeElement;const dialog=document.createElement('dialog');dialog.id='companionDialog';dialog.setAttribute('aria-labelledby','companionTitle');dialog.innerHTML=`<h2 id="companionTitle">Substituir acompanhante</h2><p>${esc(a.type)} — ${esc(a.name)}</p><form onsubmit="saveCompanionSelection(event,${a.id})"><label for="companionSelect">Acompanhante (opcional)</label><select id="companionSelect" name="companion" autofocus><option value="">Sem acompanhante</option>${db.family.map(x=>`<option value="${esc(x.name)}" ${x.name===a.companion?'selected':''}>${esc(x.name)}</option>`).join('')}</select><p id="companionError" role="alert"></p><div class="post-actions"><button type="submit" class="primary">Salvar</button><button type="button" class="secondary" onclick="closeCompanionSelection()">Cancelar</button></div></form>`;dialog.addEventListener('cancel',e=>{e.preventDefault();closeCompanionSelection()});document.body.append(dialog);dialog.showModal();dialog.querySelector('select').focus()}
function closeCompanionSelection(){const dialog=document.getElementById('companionDialog');if(dialog){dialog.close();dialog.remove()}if(companionReturnFocus?.isConnected)companionReturnFocus.focus();companionReturnFocus=null}
function saveCompanionSelection(e,id){e.preventDefault();const a=db.appointments.find(x=>x.id===id);if(!a||a.status!=='Agendado'){toast('O acompanhante de um atendimento realizado deve ser preservado.');return}const name=e.target.elements.companion.value,error=document.getElementById('companionError');if(name&&!db.family.some(x=>x.name===name)){error.textContent='Selecione um acompanhante cadastrado.';return}const conflict=appointmentConflict({...a,companion:name},a.id);if(conflict){error.textContent=conflict;return}if(name===a.companion){closeCompanionSelection();return}const old=a.companion,historyLength=db.history.length;a.companion=name;log('Acompanhante substituído: '+(old||'Sem acompanhante')+' → '+(name||'Sem acompanhante'));try{save(true)}catch(err){a.companion=old;db.history.length=historyLength;error.textContent=err.message;return}closeCompanionSelection();render();toast('Acompanhante atualizado')}

function reschedule(){const a=db.appointments.find(x=>x.id===selected);if(!a||a.status==='Realizado')return '<main>Atendimentos realizados não podem ser reagendados.</main>';return `<main>${head('Reagendar atendimento')}<div class="card"><b>${esc(a.type)} — ${esc(a.name)}</b><p>Horário atual: ${fmt(a.date)} · ${esc(a.time)}</p><p>Acompanhante: ${esc(a.companion||'Sem acompanhante')}</p></div><form onsubmit="saveReschedule(event,${a.id})">${field('Nova data','date',true,'date',a.date)}${field('Novo horário','time',true,'time',a.time)}<p class="help">Os demais dados do atendimento serão mantidos.</p><p id="rescheduleError" role="alert"></p><div class="post-actions"><button class="primary" type="submit">Salvar reagendamento</button><button class="secondary" type="button" onclick="go('appointment',${a.id})">Cancelar</button></div></form></main>`}
function saveReschedule(e,id){e.preventDefault();const a=db.appointments.find(x=>x.id===id);if(!a||a.status==='Realizado'){toast('Atendimentos realizados não podem ser reagendados.');return}if(!e.target.reportValidity()||!validateFormDates(e.target))return;const date=e.target.elements.date.value,time=e.target.elements.time.value;if(!validCalendarDate(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){toast('Informe data e horário válidos.');return}const conflict=appointmentConflict({...a,date,time},a.id);if(conflict){showConflict(conflict);return}if(date===a.date&&time===a.time&&a.status==='Agendado'){go('appointment',a.id);return}const oldDate=a.date,oldTime=a.time,oldStatus=a.status,historyLength=db.history.length;a.date=date;a.time=time;a.status='Agendado';log('Atendimento reagendado: '+a.name+' — '+fmt(oldDate)+' '+oldTime+' → '+fmt(date)+' '+time);try{save(true)}catch(error){a.date=oldDate;a.time=oldTime;a.status=oldStatus;db.history.length=historyLength;document.getElementById('rescheduleError').textContent=error.message;return}go('appointment',a.id);toast('Atendimento reagendado')}
let cancellationReturnFocus=null;
function cancelAppointment(id){const a=db.appointments.find(x=>x.id===id);if(!a||a.status!=='Agendado')return;if(document.getElementById('cancellationDialog'))return;cancellationReturnFocus=document.activeElement;const dialog=document.createElement('dialog');dialog.id='cancellationDialog';dialog.setAttribute('aria-labelledby','cancellationTitle');dialog.setAttribute('aria-describedby','cancellationDescription');dialog.innerHTML=`<h2 id="cancellationTitle">Cancelar agendamento?</h2><p><strong>${esc(a.type)} — ${esc(a.name)}</strong></p><p>${fmt(a.date)} · ${esc(a.time)}</p><p id="cancellationDescription">O atendimento será marcado como cancelado e permanecerá no histórico. O horário ficará disponível para novos agendamentos. Isso não comunica o cancelamento à clínica.</p><p id="cancellationError" role="alert"></p><div class="post-actions"><button class="secondary" type="button" autofocus onclick="closeCancellation()">Manter agendamento</button><button class="primary" type="button" onclick="confirmCancellation(${a.id})">Confirmar cancelamento</button></div>`;dialog.addEventListener('cancel',e=>{e.preventDefault();closeCancellation()});document.body.append(dialog);dialog.showModal();dialog.querySelector('[autofocus]').focus()}
function closeCancellation(){const dialog=document.getElementById('cancellationDialog');if(dialog){dialog.close();dialog.remove()}if(cancellationReturnFocus?.isConnected)cancellationReturnFocus.focus();cancellationReturnFocus=null}
function confirmCancellation(id){const a=db.appointments.find(x=>x.id===id);if(!document.getElementById('cancellationDialog')||!a||a.status!=='Agendado')return;const previousDate=a.cancelledAt,historyLength=db.history.length;a.status='Cancelado';a.cancelledAt=new Date().toISOString();log('Agendamento cancelado: '+a.type+' — '+a.name+' — '+fmt(a.date)+' '+a.time);try{save(true)}catch(error){a.status='Agendado';if(previousDate===undefined)delete a.cancelledAt;else a.cancelledAt=previousDate;db.history.length=historyLength;document.getElementById('cancellationError').textContent=error.message;return}closeCancellation();render();toast('Agendamento cancelado')}
function complete(id){let a=db.appointments.find(x=>x.id===id);if(!a||a.status!=='Agendado')return;a.companionAtCompletion=a.companion||'';a.status='Realizado';log('Atendimento marcado como realizado: '+a.name);save();render()}
function addPost(id){let a=db.appointments.find(x=>x.id===id);if(!a||a.status!=='Realizado')return;go('postAttendance',id)}
function postAttendance(){let a=db.appointments.find(x=>x.id===selected);if(!a||a.status!=='Realizado')return '<main>Atendimento não disponível.</main>';return `<main>${head('Registrar pós-atendimento')}<div class="card"><b>${esc(a.type)} – ${esc(a.name)}</b><p>Acompanhante: ${esc(a.companionAtCompletion??a.companion??'Não informado')}</p></div><form onsubmit="savePost(event)"><label for="postNotes">Informações pós-atendimento</label><textarea id="postNotes" name="postNotes" rows="8" placeholder="Escreva as informações que deseja registrar.">${esc(a.postNotes||'')}</textarea><p class="help">Texto livre, sem quantidade mínima de caracteres.</p>${a.type==='Consulta'?`<label for="prescriptionFiles">Anexar receita prescrita (PDF ou foto)</label><input id="prescriptionFiles" name="prescriptionFiles" type="file" accept="application/pdf,image/jpeg,image/png" multiple><label for="examOrderFiles">Anexar solicitação de exames (PDF ou foto)</label><input id="examOrderFiles" name="examOrderFiles" type="file" accept="application/pdf,image/jpeg,image/png" multiple><p class="help">Anexos opcionais, até 1,5 MB por arquivo. Fotos em JPG ou PNG. Anexar não cria medicamentos nem agenda exames.</p>${postDocuments(a)}`:''}<div class="post-actions"><button class="primary" type="submit">Salvar informações</button><button class="secondary" type="button" onclick="go('appointment',${a.id})">Cancelar</button></div></form></main>`}
function postDocuments(a){return (a.postDocuments||[]).map((d,i)=>`<div class="item"><b>${d.kind==='prescription'?'Receita prescrita':'Solicitação de exames'}</b><p>${esc(d.fileName)}</p><button type="button" class="smallbtn" onclick="openPostDocument(${a.id},${i})">Baixar documento</button></div>`).join('')}
function openPostDocument(id,index){let a=db.appointments.find(x=>x.id===id),d=a?.postDocuments?.[index];if(!d)return;let link=document.createElement('a');link.href=d.data;link.download=d.fileName;document.body.append(link);link.click();link.remove()}
async function savePost(e){e.preventDefault();let a=db.appointments.find(x=>x.id===selected);if(!a||a.status!=='Realizado')return;const form=e.target,button=form.querySelector('[type="submit"]');if(button.disabled)return;button.disabled=true;const oldNotes=a.postNotes,oldDocuments=a.postDocuments,oldHistoryLength=db.history.length;try{const data=new FormData(form),pending=[];if(a.type==='Consulta'){for(const [field,kind] of [['prescriptionFiles','prescription'],['examOrderFiles','exam_order']]){for(const file of data.getAll(field)){if(!file||!file.size)continue;if(file.size>1500000)throw new Error('Cada arquivo deve ter até 1,5 MB.');if(!['application/pdf','image/jpeg','image/png'].includes(file.type))throw new Error('Use PDF ou foto JPG/PNG.');const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));reader.readAsDataURL(file)});pending.push({kind,fileName:file.name,data:content,createdAt:new Date().toISOString()})}}}a.postNotes=String(data.get('postNotes')??'');a.postDocuments=[...(oldDocuments||[]),...pending];log('Pós-atendimento registrado com '+pending.length+' novo(s) documento(s)');save(true);go('appointment',a.id);toast('Informações salvas')}catch(err){a.postNotes=oldNotes;a.postDocuments=oldDocuments;db.history.length=oldHistoryLength;toast(err.message||'Não foi possível salvar. Seu formulário foi preservado.')}finally{button.disabled=false}}

function meds(){return `<main>${head('Medicamentos')}<div class="medication-actions">${btn('+ Novo medicamento','newMed')}${btn('Ler receita médica','scanPrescription','secondary')}</div><div class="tabs">${['Em uso','Histórico'].map(x=>`<button class="${tab===x?'sel':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}</div>${db.meds.filter(m=>tab==='Em uso'?m.status==='Em uso':m.status!=='Em uso').map(m=>`<div class="card tap" onclick="go('medDetail',${m.id})"><div class="line"><div><b>◇ ${esc(m.name)} ${esc(m.strength)}</b><p class="muted">${esc(m.amount)} · ${esc(m.schedule)}</p><span class="pill">${esc(m.status)}</span></div><b>›</b></div></div>`).join('')||'<div class="empty">Nenhum medicamento nesta categoria.</div>'}</main>`}
function newMed(){return `<main>${head('Novo medicamento')}<form onsubmit="saveMed(event)">${field('Nome do medicamento','name',true)}${field('Concentração (ex.: 40 mg)','strength',true)}${field('Quantidade por administração','amount',true)}${field('Via de administração (opcional)','route')}${field('Frequência','frequency',true)}${field('Horários ou períodos','schedule',true)}${field('Data de início','start',true,'date')}<label>Uso contínuo</label><select name="continuous"><option>Sim</option><option>Não</option></select><p class="help">Registre somente a posologia prescrita. O aplicativo não recomenda doses nem registra tomadas.</p><button class="primary" type="submit">Salvar medicamento</button></form></main>`}
function saveMed(e){e.preventDefault();if(!validateFormDates(e.target))return;let m={...Object.fromEntries(new FormData(e.target)),id:Date.now(),status:'Em uso'};db.meds.unshift(m);log('Medicamento cadastrado: '+m.name);save();go('meds');toast('Medicamento cadastrado!')}
function medDetail(){let m=db.meds.find(x=>x.id===selected);if(!m)return '';return `<main>${head('Detalhes do medicamento')}<div class="card"><h2>${esc(m.name)} ${esc(m.strength)}</h2><span class="pill">${esc(m.status)}</span><p><b>Quantidade:</b> ${esc(m.amount)}</p><p><b>Via:</b> ${esc(m.route||'Não informada')}</p><p><b>Frequência:</b> ${esc(m.frequency)}</p><p><b>Horários:</b> ${esc(m.schedule)}</p><p><b>Início:</b> ${fmt(m.start)}</p>${m.status==='Concluído'?`<p><b>Conclusão:</b> ${m.completedAt?esc(new Date(m.completedAt).toLocaleDateString('pt-BR')):'Não registrada'}</p>`:''}${m.status==='Suspenso'?`<p><b>Data da suspensão:</b> ${m.suspendedAt?esc(new Date(m.suspendedAt).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'})):'Não registrada'}</p>`:''}</div>${m.status==='Em uso'?`<button class="secondary" style="width:100%" onclick="editMed(${m.id})">Alterar posologia</button>`:''}${m.status==='Em uso'?`<button class="primary" onclick="suspendMed(${m.id})">Suspender medicamento</button><button class="secondary" style="width:100%" onclick="completeMedication(${m.id})">Concluir tratamento</button>`:''}<p class="help">Histórico de alterações disponível na aba Histórico. Receitas anexadas ainda não são suportadas nesta demonstração.</p></main>`}
let dosageReturnFocus=null;
function editMed(id){let m=db.meds.find(x=>x.id===id);if(!m||m.status!=='Em uso'){toast('Medicamentos suspensos não podem ser alterados.');return}if(document.getElementById('dosageDialog'))return;dosageReturnFocus=document.activeElement;const dialog=document.createElement('dialog');dialog.id='dosageDialog';dialog.setAttribute('aria-labelledby','dosageTitle');dialog.innerHTML=`<h2 id="dosageTitle">Alterar posologia</h2><p><strong>${esc(m.name)} ${esc(m.strength)}</strong></p><form onsubmit="saveDosage(event,${m.id})"><label for="dosageAmount">Quantidade por administração</label><input id="dosageAmount" name="amount" value="${esc(m.amount)}" required autofocus><p class="help">Informe a quantidade conforme a prescrição.</p><div class="post-actions"><button class="primary" type="submit">Salvar alterações</button><button class="secondary" type="button" onclick="closeDosage()">Cancelar</button></div></form>`;dialog.addEventListener('cancel',e=>{e.preventDefault();closeDosage()});document.body.append(dialog);dialog.showModal();dialog.querySelector('input').focus()}
function closeDosage(){const dialog=document.getElementById('dosageDialog');if(dialog){dialog.close();dialog.remove()}if(dosageReturnFocus?.isConnected)dosageReturnFocus.focus();dosageReturnFocus=null}
function saveDosage(e,id){e.preventDefault();let m=db.meds.find(x=>x.id===id);if(!m||m.status!=='Em uso'){toast('Medicamentos suspensos não podem ser alterados.');return}const input=e.target.elements.amount;const value=input.value.trim();if(!value){input.setCustomValidity('Informe a quantidade por administração.');input.reportValidity();input.oninput=()=>input.setCustomValidity('');return}if(value===m.amount){closeDosage();return}const old=m.amount,historyLength=db.history.length;m.amount=value;log('Posologia de '+m.name+': '+old+' → '+value);try{save(true)}catch(error){m.amount=old;db.history.length=historyLength;toast(error.message);return}closeDosage();render();toast('Posologia atualizada')}

let suspensionReturnFocus=null;
function completeMedication(id){const m=db.meds.find(x=>x.id===id);if(!m||m.status!=='Em uso'||document.getElementById('treatmentDialog'))return;const dialog=document.createElement('dialog');dialog.id='treatmentDialog';dialog.setAttribute('aria-labelledby','treatmentTitle');dialog.innerHTML=`<h2 id="treatmentTitle">Concluir tratamento?</h2><p>${esc(m.name)} ${esc(m.strength)}</p><p>Confirme o término do tratamento conforme a prescrição. O registro será preservado no histórico.</p><div class="post-actions"><button type="button" class="secondary" autofocus onclick="document.getElementById('treatmentDialog').close();document.getElementById('treatmentDialog').remove()">Cancelar</button><button type="button" class="primary" onclick="confirmMedicationCompletion(${id})">Confirmar conclusão</button></div>`;dialog.addEventListener('cancel',()=>dialog.remove());document.body.append(dialog);dialog.showModal()}
function confirmMedicationCompletion(id){const m=db.meds.find(x=>x.id===id),dialog=document.getElementById('treatmentDialog');if(!m||m.status!=='Em uso'||!dialog)return;const old=m.completedAt,historyLength=db.history.length;m.status='Concluído';m.completedAt=new Date().toISOString();log('Tratamento concluído: '+m.name);try{save(true)}catch(error){m.status='Em uso';m.completedAt=old;db.history.length=historyLength;toast(error.message);return}dialog.close();dialog.remove();render();toast('Tratamento concluído')}
function suspendMed(id){let m=db.meds.find(x=>x.id===id);if(!m||m.status!=='Em uso'||document.getElementById('suspensionDialog'))return;suspensionReturnFocus=document.activeElement;const dialog=document.createElement('dialog');dialog.id='suspensionDialog';dialog.setAttribute('aria-labelledby','suspensionTitle');dialog.setAttribute('aria-describedby','suspensionDescription');dialog.innerHTML=`<h2 id="suspensionTitle">Suspender medicamento?</h2><p><strong>${esc(m.name)} ${esc(m.strength)}</strong></p><p id="suspensionDescription">Confirme se deseja marcar este medicamento como suspenso. A ação será registrada no histórico.</p><div class="post-actions"><button type="button" class="primary" onclick="confirmSuspension(${m.id})">Confirmar suspensão</button><button type="button" class="secondary" autofocus onclick="closeSuspension()">Cancelar</button></div>`;dialog.addEventListener('cancel',e=>{e.preventDefault();closeSuspension()});document.body.append(dialog);dialog.showModal();dialog.querySelector('[autofocus]').focus()}
function closeSuspension(){const dialog=document.getElementById('suspensionDialog');if(dialog){dialog.close();dialog.remove()}if(suspensionReturnFocus?.isConnected)suspensionReturnFocus.focus();suspensionReturnFocus=null}

async function readDocument(mode){let input=$('scanFile'),file=input?.files?.[0];if(!file){toast('Selecione um documento.');return}if(file.size>5*1024*1024){toast('Para esta demonstração, escolha um arquivo de até 5 MB.');return}let status=$('scanStatus');status.textContent='Lendo documento...';try{let text='';if(file.type.startsWith('text/')||file.name.toLowerCase().endsWith('.txt'))text=await file.text();else if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;for(let i=1;i<=Math.min(pdf.numPages,4);i++){let page=await pdf.getPage(i),c=await page.getTextContent();text+='\n'+c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')}}else if(file.type.startsWith('image/')){if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');let r=await Tesseract.recognize(file,'por+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent='Reconhecendo texto: '+Math.round((m.progress||0)*100)+'%'}});text=r.data.text}else throw Error('Formato não suportado');$('scanText').value=text.trim();status.textContent=text.trim()?'Leitura concluída. Confira o texto e prossiga para a revisão.':'Não foi encontrado texto. Transcreva manualmente e prossiga.';readSource={name:file.name,type:file.type};if(text.trim())manualImport(mode);}catch(e){status.textContent='Não foi possível extrair o texto automaticamente. Transcreva o documento no campo abaixo. '+e.message}}
// Extract only explicit prescription text. Never calculate doses or invent schedules.
function extractPrescriptionFields(raw) {
  const blank = () => ({ name:'', strength:'', amount:'', route:'', frequency:'', schedule:'', start:'', continuous:'' });
  const lines = raw.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const items = [];
  let current = null;
  const normalize = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const labels = { medicamento:'name', nome:'name', concentracao:'strength', quantidade:'amount', 'quantidade por administracao':'amount', via:'route', 'via de administracao':'route', frequencia:'frequency', horario:'schedule', horarios:'schedule', 'horarios ou periodos':'schedule', inicio:'start', 'data de inicio':'start', 'uso continuo':'continuous' };
  for (const line of lines) {
    const normalized = normalize(line);
    if (/^(receita|prescricao|paciente|nome do paciente|medico|prescritor|dr\b|dra\b|crm|cpf|rg\b|endereco|telefone|contato|clinica|hospital|assinatura|data\s*:)/.test(normalized)) continue;
    const labeled = line.match(/^([^:]+):\s*(.*)$/);
    const key = labeled && labels[normalize(labeled[1].trim())];
    if (key) {
      if (key === 'name') { current = blank(); items.push(current); }
      if (!current) continue;
      let value = labeled[2].trim();
      if (key === 'start') {
        const date = value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (date) value = `${date[3]}-${date[2]}-${date[1]}`;
        if (!validCalendarDate(value)) value = '';
      }
      if (key === 'continuous') value = /^sim$/i.test(value) ? 'Sim' : /^n[aã]o$/i.test(value) ? 'Não' : '';
      current[key] = value;
      continue;
    }
    // A drug header must contain an explicit strength; unrelated lines are ignored.
    const header = line.match(/^(?:\d+[.)-]\s*)?([\p{L}][\p{L}\d\s()+.-]*?)\s+(\d+(?:[.,]\d+)?\s*(?:mg|mcg|µg|g|ml|UI)(?:\s*\/\s*\d*\s*(?:ml|g))?)(?:\s*[-–—].*)?$/iu);
    if (header) { current = blank(); current.name = header[1].trim(); current.strength = header[2].trim(); items.push(current); continue; }
    if (!current) continue;
    const amount = line.match(/(?:tomar|usar|administrar|aplicar)\s+(\d+(?:[.,]\d+)?\s*(?:comprimidos?|c[aá]psulas?|gotas?|ml|doses?|sach[eê]s?))/i);
    if (amount && !current.amount) current.amount = amount[1];
    const route = line.match(/\b(?:via\s+(?:oral|sublingual|intravenosa|intramuscular|subcut[aâ]nea|t[oó]pica)|uso\s+(?:oral|t[oó]pico)|VO|SL)\b/i);
    if (route && !current.route) current.route = route[0];
    const frequency = line.match(/\b(?:de\s+\d+\s+em\s+\d+\s*horas?|a cada\s+\d+\s*horas?|\d+\s*\/\s*\d+\s*h|\d+\s*(?:x|vezes?)\s*(?:ao|por)?\s*dia|uma vez ao dia)\b/i);
    if (frequency && !current.frequency) current.frequency = frequency[0];
    const times = line.match(/\b\d{1,2}:\d{2}\b/g);
    const periods = line.match(/(?<![\p{L}])(?:manh[ãa]|tarde|noite|ao deitar|em jejum)(?![\p{L}])/giu);
    if (!current.schedule && (times || periods)) current.schedule = (times || periods).join(', ');
    if (/\buso cont[ií]nuo\b/i.test(line)) current.continuous = 'Sim';
  }
  return items.length ? items : [blank()];
}

function cancelImport(){const prescription=importDraft?.mode==='prescription';importDraft=null;readSource=null;delete formDrafts.reviewImport;companionReturn=null;go(prescription?'meds':'agenda')}
// Conservative text extraction: unknown text stays available for manual review.
function extractExamFields(raw) {
  const blank = () => ({name:'',date:'',time:'',location:'',companion:'',prep:''});
  const normalized = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const items=[];let current=null,inSection=false;
  for(const original of raw.split(/\r?\n/)){
    let line=original.trim();if(!line)continue;
    let text=normalized(line);
    const field=line.match(/^(data do exame|data do agendamento|hor[aá]rio(?: do exame)?|local(?: do exame| do agendamento)?|preparo|prepara[cç][aã]o|instru[cç][oõ]es de preparo)\s*:\s*(.+)$/i);
    if(field){
      if(!current)continue;
      const label=normalized(field[1]),value=field[2].trim();
      if(label.startsWith('data')){const parts=value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);const date=parts?`${parts[3]}-${parts[2]}-${parts[1]}`:value;if(validCalendarDate(date))current.date=date;}
      else if(label.startsWith('horario')){if(/^([01]\d|2[0-3]):[0-5]\d$/.test(value))current.time=value;}
      else if(label.startsWith('local'))current.location=value;
      else current.prep=value;
      continue;
    }
    if(/^(paciente|nome do paciente|nome\s*:|clinica|hospital|laboratorio|centro medico|medic[oa]|dr[.\s]|dra[.\s]|crm|cnpj|cpf|rg\b|telefone|tel\b|contato|endereco|rua\b|avenida|av\.|cep|email|e-mail|data\b|cidade|assinatura|documento ficticio|convenio)/.test(text))continue;
    if(/^(indicacao|justificativa|hipotese|diagnostico|observacoes)\b/.test(text)){inSection=false;continue;}
    const section=line.match(/^(?:solicito(?:\s+os)?|solicita[cç][aã]o(?: de exames)?|pedido(?: de exames)?|exames(?: solicitados)?)\s*:?\s*(.*)$/i);
    if(section){inSection=true;line=section[1].replace(/^(?:os seguintes exames|seguintes exames|exames|os seguintes)\s*:?\s*/i,'').trim();if(!line)continue;}
    const numbered=/^(?:\d+[.)-]|[-•–])\s*/.test(line);
    const explicit=/^exame\s*:/i.test(line);
    line=line.replace(/^(?:\d+[.)-]|[-•–])\s*/,'').replace(/^exame\s*:\s*/i,'').trim();
    text=normalized(line);
    // Do not turn phone numbers, dates, addresses or signature debris into exams.
    if(!line||!/[\p{L}]/u.test(line)||/\(?\d{2}\)?\s*\d{4,5}[-\s]\d{4}|\d{2}\/\d{2}\/\d{4}|@/.test(line))continue;
    if(/^(clinica|telefone|tel\b|crm|paciente|dr\b|dra\b|assinatura)/.test(text))continue;
    if(!(numbered||explicit||inSection))continue;
    for(const name of line.split(/\s*;\s*/).filter(Boolean)){
      if(name.length>160)continue;
      current={...blank(),name};items.push(current);
    }
  }
  return items.length?items:[blank()];
}

function manualImport(mode){let raw=$('scanText')?.value?.trim();if(!raw){toast('Informe ou extraia o texto do documento.');return}let lines=raw.split(/\n/).map(x=>x.trim()).filter(Boolean),strength=raw.match(/\b\d+(?:[.,]\d+)?\s*(?:mg|mcg|g|ml|µg)\b/i);let first=lines.find(x=>!/^receita|^prescri|^paciente|^data|^solicita|^pedido|^exames?/i.test(x))||lines[0];importDraft={mode,raw,source:readSource,items:[]};if(mode==='prescription'){importDraft.items=extractPrescriptionFields(raw)}else{importDraft.items=extractExamFields(raw)}go('reviewImport')}
function reviewImport(){if(!importDraft)return `<main>${head('Revisão')}Nenhum documento para revisar.</main>`;let med=importDraft.mode==='prescription';return `<main>${head(med?'Confirmar medicamentos':'Confirmar exames')}<div class="notice"><b>Confira antes de salvar.</b> O sistema não interpreta com segurança a posologia ou as instruções de preparo. Preencha os campos conforme o documento e confirme explicitamente.</div><div class="card"><b>Texto extraído ou transcrito</b><p class="help" style="white-space:pre-wrap;max-height:145px;overflow:auto">${esc(importDraft.raw)}</p></div><form id="importForm" onsubmit="confirmImport(event)">${importDraft.items.map((item,i)=>`<div class="card"><h3>${med?'Medicamento':'Exame'} ${i+1}</h3>${field('Nome','name_'+i,true,'text',item.name)}${med?`${field('Concentração','strength_'+i,true,'text',item.strength)}${field('Quantidade por administração','amount_'+i,true,'text',item.amount)}${field('Via de administração (opcional)','route_'+i,false,'text',item.route)}${field('Frequência','frequency_'+i,true,'text',item.frequency)}${field('Horários','schedule_'+i,true,'text',item.schedule)}${field('Data de início','start_'+i,true,'date',item.start)}<label for="continuous_${i}">Uso contínuo</label><select id="continuous_${i}" name="continuous_${i}"><option value="">Não informado</option><option ${item.continuous==='Sim'?'selected':''}>Sim</option><option ${item.continuous==='Não'?'selected':''}>Não</option></select>`:`${field('Data do exame','date_'+i,true,'date',item.date)}${field('Horário','time_'+i,true,'time',item.time)}${field('Local','location_'+i,true,'text',item.location)}<label>Acompanhante (opcional)</label><select name="companion_${i}"><option value="">Sem acompanhante definido</option>${db.family.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select>${field('Preparo (se houver)','prep_'+i,false,'text',item.prep)}`}</div>`).join('')}<label><input type="checkbox" name="confirmed" required style="width:auto"> Conferi os dados com o documento original e autorizo o cadastro.</label><button class="primary" type="submit">${med?'Confirmar e cadastrar medicamento':'Confirmar e criar agendamento(s)'}</button><button class="secondary" style="width:100%;min-height:48px" type="button" onclick="cancelImport()">Cancelar</button></form>${!med?`<button class="secondary" style="width:100%" onclick="addCompanionFrom('reviewImport')">+ Cadastrar acompanhante</button>`:''}</main>`}
function confirmImport(e){e.preventDefault();if(!validateFormDates(e.target))return;if(!importDraft)return;let d=Object.fromEntries(new FormData(e.target));if(!d.confirmed){toast('Confirme a revisão humana.');return}if(importDraft.mode!=='prescription'){let pending=[];for(let i=0;i<importDraft.items.length;i++){let candidate={date:String(d['date_'+i]||'').trim(),time:String(d['time_'+i]||'').trim(),companion:String(d['companion_'+i]||'').trim()};let conflict=appointmentConflict(candidate,null,pending);if(conflict){showConflict(conflict);return}pending.push(candidate)}}for(let i=0;i<importDraft.items.length;i++){let get=k=>String(d[k+'_'+i]||'').trim();if(importDraft.mode==='prescription'){let m={id:Date.now()+i,name:get('name'),strength:get('strength'),amount:get('amount'),route:get('route'),frequency:get('frequency'),schedule:get('schedule'),start:get('start'),continuous:get('continuous'),status:'Em uso',sourceDocument:importDraft.source?.name||'Texto transcrito'};db.meds.unshift(m);log('Medicamento confirmado após revisão humana: '+m.name)}else{let a={id:Date.now()+i,type:'Exame',name:get('name'),date:get('date'),time:get('time'),location:get('location'),companion:get('companion'),prep:get('prep'),status:'Agendado',sourceDocument:importDraft.source?.name||'Texto transcrito',results:[]};db.appointments.unshift(a);log('Exame confirmado após revisão humana: '+a.name)}}let mode=importDraft.mode;importDraft=null;readSource=null;delete formDrafts.reviewImport;save();go(mode==='prescription'?'meds':'agenda');toast('Cadastro confirmado!')}
function addResult(){let a=db.appointments.find(x=>x.id===selected);if(!a||a.type!=='Exame')return `<main>Resultados disponíveis apenas para exames.</main>`;return `<main>${head('Anexar resultado de exame')}<div class="card"><b>${esc(a.type)} – ${esc(a.name)}</b><p class="muted">${fmt(a.date)}</p></div><form onsubmit="saveResult(event)">${field('Nome do resultado (opcional)','name')}${field('Data de disponibilização','date',false,'date')}<label>Arquivo (PDF, JPG ou PNG) *</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required><p class="help">Limite de 10 MB por arquivo (PDF, JPG ou PNG). O arquivo ficará apenas no armazenamento deste navegador. Não use documentos médicos reais.</p><button class="primary" type="submit">Anexar resultado</button></form></main>`}
function resultFileType(file){if(file.type==='application/pdf'||(!file.type&&/\.pdf$/i.test(file.name)))return 'application/pdf';if(['image/png','image/jpeg'].includes(file.type))return file.type;return ''}
function openResultStorage(){return new Promise((resolve,reject)=>{const request=indexedDB.open('cuidado-familia-files',1);request.onupgradeneeded=()=>request.result.createObjectStore('results');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(new Error('Não foi possível abrir o armazenamento de arquivos.'));request.onblocked=()=>reject(new Error('Feche outras abas do aplicativo e tente novamente.'))})}
async function storeResultFile(key,file){const storage=await openResultStorage();try{await new Promise((resolve,reject)=>{const tx=storage.transaction('results','readwrite');tx.objectStore('results').put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{storage.close()}}
async function deleteResultFile(key){const storage=await openResultStorage();try{await new Promise((resolve,reject)=>{const tx=storage.transaction('results','readwrite');tx.objectStore('results').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}finally{storage.close()}}
async function loadResultFile(key){const storage=await openResultStorage();try{return await new Promise((resolve,reject)=>{const tx=storage.transaction('results','readonly'),request=tx.objectStore('results').get(key);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}finally{storage.close()}}
async function saveResult(e){e.preventDefault();if(!validateFormDates(e.target))return;const a=db.appointments.find(x=>x.id===selected),d=Object.fromEntries(new FormData(e.target)),file=d.file;if(!a||a.type!=='Exame'){toast('Resultados disponíveis apenas para exames.');return}if(!file||!file.size){toast('Selecione o arquivo.');return}if(file.size>10000000){toast('O arquivo deve ter até 10 MB.');return}const type=resultFileType(file);if(!type){toast('Use PDF, PNG ou JPG.');return}const button=e.target.querySelector('[type="submit"]');if(button.disabled)return;button.disabled=true;const key=crypto.randomUUID(),oldResults=a.results,historyLength=db.history.length;try{await storeResultFile(key,file);a.results=[...(oldResults||[]),{name:String(d.name||'').trim()||file.name,date:d.date,fileName:file.name,fileKey:key,type,size:file.size}];log('Resultado anexado ao atendimento: '+a.name);save(true);go('appointment',a.id);toast('Resultado anexado!')}catch(error){a.results=oldResults;db.history.length=historyLength;try{await deleteResultFile(key)}catch(cleanupError){}toast('Não foi possível armazenar o arquivo. Verifique o espaço disponível e tente novamente.')}finally{button.disabled=false}}

async function openResult(id,index){const a=db.appointments.find(x=>x.id===id),r=a?.results?.[index];if(!r)return;let url;try{if(r.fileKey){const file=await loadResultFile(r.fileKey);if(!file)throw new Error('Arquivo não encontrado neste navegador.');url=URL.createObjectURL(new Blob([file],{type:r.type||file.type}));}const link=document.createElement('a');link.href=url||r.data;link.download=r.fileName;document.body.append(link);link.click();link.remove();if(url)setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(error){toast(error.message||'Não foi possível abrir o arquivo.')}}
function render(){if(!db.activePatientId&&!['home','newPatient','patients','more','userProfile'].includes(page))page='home';let content={reschedule,userProfile,appointmentList,postAttendance,scanPrescription,scanExam,reviewImport,addResult,home,patients,newPatient,addCompanion,agenda,newAppointment,appointment:detail,meds,newMed,medDetail,family,invite,history,reports,more}[page]||home;$('root').innerHTML=content()+nav();if(page==='newAppointment')restoreDraft(document.getElementById('apptForm'),'appointment');if(page==='reviewImport')restoreDraft(document.getElementById('importForm'),'reviewImport')}
render();
</script></body></html>
