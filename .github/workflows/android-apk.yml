name: Gerar APK Android de testes
on:
  workflow_dispatch:
  push:
    branches: [main, codex/homologacao-locaweb]
    paths:
      - 'mobile/**'
      - 'prototypes/**'
      - 'php/**'
      - 'server/auth-ui.js'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Instalar dependências fixadas
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar telas e projeto Android
        working-directory: mobile
        run: |
          npm run build
          npm run android:prepare
      - name: Compilar APK assinado para testes
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease lintDebug
      - name: Preparar download e verificação
        run: |
          mkdir -p apk-download
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk apk-download/nos-cuidamos-teste.apk
          cp docs/android-apk.md apk-download/LEIA-ME.md
          cd apk-download
          sha256sum nos-cuidamos-teste.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nos-cuidamos-apk-teste
          path: apk-download/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nos-cuidamos-aab-sem-assinatura
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
      - name: Resumo do download
        run: |
          echo '### APK Nós Cuidamos' >> "$GITHUB_STEP_SUMMARY"
          echo 'Baixe **nos-cuidamos-apk-teste** na seção Artifacts desta execução. É um APK debug instalável, sem Google Play.' >> "$GITHUB_STEP_SUMMARY"
  instalar:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: nos-cuidamos-apk-teste
          path: apk-download
      - name: Permitir aceleração no emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install apk-download/nos-cuidamos-teste.apk
            adb shell am start -W -n br.com.gabale.noscuidamos.teste/.MainActivity | tee android-start.txt
            grep -q 'Status: ok' android-start.txt
            adb shell pidof br.com.gabale.noscuidamos.teste
            node mobile/check-locaweb-emulator.mjs
            adb exec-out screencap -p > android-tela-local.png
            adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:br.com.gabale.noscuidamos.teste
            bash -e -c 'for attempt in {1..10}; do adb shell uiautomator dump /sdcard/nc-icon.xml >/dev/null 2>&1 || true; if adb shell cat /sdcard/nc-icon.xml 2>/dev/null | grep -q "Nós Cuidamos"; then exit 0; fi; sleep 2; done; exit 1'
            adb exec-out screencap -p > android-icone.png
      - uses: actions/upload-artifact@v4
        with:
          name: nos-cuidamos-validacao-android
          path: |
            android-icone.png
            android-tela-local.png
            android-start.txt
          retention-days: 30
          if-no-files-found: error
