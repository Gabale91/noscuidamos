services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: runtime.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - app-data:/app/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-noscuidamos.gabale.com.br}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - https-data:/data
      - https-config:/config
    depends_on:
      - app
volumes:
  app-data:
  https-data:
  https-config:
